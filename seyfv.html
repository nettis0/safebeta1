<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Личный виртуальный сейф</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
<style>
:root {
  --accent-color: #6750A4;
  --md-primary: #6750A4;
  --md-on-primary: #ffffff;
  --md-primary-container: #EADDFF;
  --md-on-primary-container: #21005D;
  --md-surface: #FEF7FF;
  --md-on-surface: #1D1B20;
  --md-surface-variant: #E7E0EC;
  --md-on-surface-variant: #49454F;
  --md-outline: #79747E;
  --md-outline-variant: #CAC4D0;
  --md-surface-container: #F3EDF7;
  --md-surface-container-high: #ECE6F0;
  --md-error: #B3261E;
}

[data-theme="dark"] {
  --md-primary: #D0BCFF;
  --md-on-primary: #381E72;
  --md-primary-container: #4F378B;
  --md-on-primary-container: #EADDFF;
  --md-surface: #141218;
  --md-on-surface: #E6E1E5;
  --md-surface-variant: #49454F;
  --md-on-surface-variant: #CAC4D0;
  --md-outline: #938F99;
  --md-outline-variant: #49454F;
  --md-surface-container: #211F26;
  --md-surface-container-high: #2B2930;
  --md-error: #F2B8B5;
}

body {
  margin: 0;
  background: var(--md-surface);
  color: var(--md-on-surface);
  font-family: 'Roboto', 'Segoe UI', sans-serif;
  transition: background 0.3s, color 0.3s;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.top {
  height: auto;
  min-height: 64px;
  background: var(--md-surface-container-high);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 16px;
  border-bottom: 1px solid var(--md-outline-variant);
  box-sizing: border-box;
  flex-wrap: wrap;
  gap: 8px;
}
.top a {
  color: var(--md-primary) !important;
  text-decoration: none;
  font-weight: 500;
  margin-left: 12px;
  font-size: 14px;
}
.top a:hover { text-decoration: underline; }

#clockContainer {
  padding: 6px 12px;
  background: var(--md-primary-container);
  color: var(--md-on-primary-container);
  border-radius: 12px;
  font-weight: 500;
  font-size: 16px;
}

.center { font-size: 20px; font-weight: 400; text-align: center; flex: 1; min-width: 150px; }
.right { display: flex; justify-content: flex-end; align-items: center; }

.wrap { display: flex; flex: 1; height: calc(100vh - 64px); }

.side {
  width: 320px;
  background: var(--md-surface-container);
  padding: 16px;
  overflow: auto;
  border-right: 1px solid var(--md-outline-variant);
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
}
.side h3 {
  margin-top: 0;
  font-size: 14px;
  font-weight: 500;
  color: var(--md-on-surface-variant);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.main { flex: 1; padding: 24px; position: relative; overflow: auto; box-sizing: border-box; }
#title { font-size: 24px; font-weight: 400; margin-top: 0; margin-bottom: 24px; word-break: break-word; }

.node {
  padding: 0 12px;
  min-height: 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  color: var(--md-on-surface-variant);
  border-radius: 24px;
  margin-bottom: 4px;
  transition: 0.2s;
  font-weight: 500;
  font-size: 14px;
}
.node:hover { background: var(--md-surface-variant); color: var(--md-on-surface); }
.selected { 
  background: var(--md-primary-container) !important; 
  color: var(--md-on-primary-container) !important; 
}
.node button {
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 4px;
  border-radius: 50%;
  font-size: 14px;
  color: var(--md-primary);
}
.node button.btn-delete { color: var(--md-error); }

.item {
  display: inline-flex;
  width: 140px;
  height: 140px;
  background: var(--md-surface-container-high);
  border: 1px solid var(--md-outline-variant);
  border-radius: 16px;
  margin: 6px;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  cursor: pointer;
  position: relative;
  vertical-align: top;
  color: var(--md-on-surface);
  box-shadow: 0px 1px 3px rgba(0,0,0,0.05);
}
.item img { max-width: 100%; max-height: 100%; object-fit: cover; }

.fab {
  position: fixed;
  right: 16px;
  bottom: 16px;
  width: 56px;
  height: 56px;
  border-radius: 16px;
  font-size: 28px;
  background: var(--md-primary-container);
  color: var(--md-on-primary-container);
  border: none;
  cursor: pointer;
  box-shadow: 0px 4px 8px rgba(0,0,0,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999;
}

.menu {
  display: none;
  position: fixed;
  right: 16px;
  bottom: 80px;
  background: var(--md-surface-container-high);
  color: var(--md-on-surface);
  border: 1px solid var(--md-outline-variant);
  padding: 4px;
  border-radius: 12px;
  z-index: 1000;
  box-shadow: 0px 4px 12px rgba(0,0,0,0.15);
}
.menu div { padding: 12px 16px; cursor: pointer; border-radius: 8px; font-size: 14px; }
.menu div:hover { background: var(--md-surface-variant); }

textarea, .searchBox {
  width: 100%;
  background: var(--md-surface);
  color: var(--md-on-surface);
  border: 1px solid var(--md-outline);
  border-radius: 8px;
  padding: 8px 12px;
  box-sizing: border-box;
  font-size: 14px;
  outline: none;
}
textarea:focus, .searchBox:focus { border-color: var(--md-primary); border-width: 2px; padding: 7px 11px; }
textarea { height: 300px; resize: none; }

.btn {
  padding: 8px 16px;
  cursor: pointer;
  border: none;
  background: var(--md-primary);
  color: var(--md-on-primary);
  border-radius: 20px;
  font-weight: 500;
  font-size: 14px;
}

.add-root-btn {
  background: var(--md-primary) !important;
  padding: 0; width: 40px; height: 40px; min-width: 40px;
  border-radius: 12px; display: flex; align-items: center; justify-content: center;
}
.add-root-btn svg { width: 20px; height: 20px; fill: #ffffff; }

.item-delete {
  position: absolute; right: 4px; bottom: 4px;
  cursor: pointer; background: var(--md-error); color: white; border: none; border-radius: 6px; padding: 4px 6px; font-size: 12px;
}

#customDeleteModal, #noteModal, #settingsOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 99999; }
#customDeleteModal .box, #noteBox, #settingsWindow {
  width: 500px; max-width: 95%; margin: 10vh auto;
  background: var(--md-surface-container-high); color: var(--md-on-surface);
  border-radius: 28px; padding: 24px; box-sizing: border-box;
}
#noteBox { width: 90%; max-width: 700px; height: 80vh; display: flex; flex-direction: column; }
#noteHeader { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 8px; }

#loginScreen { position: fixed; inset: 0; background: #FEF7FF; display: flex; align-items: center; justify-content: center; z-index: 100000; }
#loginBox { background: #F3EDF7; padding: 32px 24px; border-radius: 28px; width: 320px; text-align: center; color: #1D1B20; }
#loginInput { width: 100%; height: 48px; border-radius: 8px; margin-top: 10px; padding: 0 12px; background: #FFF; border: 1px solid #79747E; box-sizing: border-box; }
#loginBtn { width: 100%; height: 40px; border-radius: 20px; border: none; margin-top: 24px; background: #6750A4; color: white; font-weight: 500; cursor: pointer; }

.viewer { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.9); align-items: center; justify-content: center; z-index: 100005; }
.viewer img { max-width: 95%; max-height: 95%; border-radius: 12px; }
.color-picker-btn { border: none; border-radius: 12px; padding: 8px 12px; cursor: pointer; color: white; font-weight: bold; font-size: 12px; }

#settingsBtn { 
  position: fixed; left: 16px; bottom: 16px; width: 56px; height: 56px; border-radius: 16px; 
  background: var(--md-primary-container); color: var(--md-on-primary-container); 
  display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 24px; z-index: 998; 
  box-shadow: 0px 4px 8px rgba(0,0,0,0.15);
}

#syncStatus { font-size: 12px; color: var(--md-on-surface-variant); margin-top: 8px; text-align: center; }

@media (max-width: 768px) {
  .wrap { flex-direction: column; height: auto; overflow: visible; }
  .side { width: 100%; border-right: none; border-bottom: 1px solid var(--md-outline-variant); height: auto; max-height: 300px; }
  .main { padding: 16px; padding-bottom: 80px; }
  #settingsBtn { left: 16px; bottom: 16px; }
  .fab { right: 16px; bottom: 16px; }
  .menu { right: 16px; bottom: 80px; }
}
</style>
</head>
<body>

<div id="loginScreen">
 <div id="loginBox">
  <h2>Личный сейф</h2>
  <input id="loginInput" type="password" placeholder="Введите пароль">
  <button id="loginBtn" onclick="handleLogin()">Войти</button>
  <div id="loginError" style="color:#B3261E;margin-top:12px;font-size:14px"></div>
  <div id="syncStatus">Инициализация облака...</div>
 </div>
</div>

<div class="top">
  <div id="clockContainer"><span id="clock"></span></div>
  <div class="center">Виртуальный сейф</div>
  <div class="right">
    <a href="https://gemini.google.com" target="_blank">Gemini</a>
    <a href="https://chatgpt.com" target="_blank">ChatGPT</a>
  </div>
</div>

<div class="wrap">
<div class="side">
<h3>
  <span>Каталоги</span>
  <div style="display:flex;gap:8px;align-items:center;width:100%;">
    <input id='catalogSearch' class='searchBox' placeholder='🔍 Поиск...' oninput='searchCatalogs()' style="margin-bottom:0; height:40px; flex:1;"> 
    <button onclick="newRoot()" class="btn add-root-btn" title="Добавить каталог">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    </button>
  </div>
</h3>
<div id="tree" class="tree"></div>
</div>

<div class="main">
<h2 id="title">Выберите каталог</h2>
<div id="content">Пусто</div>

<button class="fab" onclick="toggleMenu()">+</button>
<div id="menu" class="menu">
<div onclick="createNote()">Создать заметку</div>
<div onclick="uploadFile()">Добавить файл</div>
</div>
<input type="file" id="fileInput" hidden>
</div>
</div>

<div id="viewer" class="viewer" onclick="this.style.display='none'">
<img id="viewerImg" alt="Просмотр">
</div>

<div id="customDeleteModal">
 <div class="box">
  <h3 id="delTitle" style="margin-top:0;font-size:22px;font-weight:400">Удаление</h3>
  <p id="delText" style="color:var(--md-on-surface-variant);margin:16px 0 24px">Подтверждение удаления</p>
  <div style="display:flex;justify-content:flex-end;gap:12px">
   <button onclick="closeDeleteModal()" class="btn" style="background:transparent;color:var(--md-primary)">Отмена</button>
   <button id="deleteConfirmBtn" class="btn" style="background:var(--md-error);color:white">Удалить</button>
  </div>
 </div>
</div>

<div id="noteModal">
 <div id="noteBox">
  <div id="noteHeader">
   <button onclick="closeNoteModal()" class="btn" style="background:transparent;color:var(--md-primary)">✕</button>
   <div>
    <span id="noteTitleView" onclick="enableTitleEdit()" style="cursor:text;font-size:18px;font-weight:500;"></span>
    <input id="noteTitleEdit" class="searchBox" style="display:none;width:150px;" onblur="saveCurrentNote()">
   </div>
   <button onclick="saveCurrentNote()" class="btn">ОК</button>
  </div>
  <textarea id="noteContent" placeholder="Текст заметки..."></textarea>
 </div>
</div>

<div id="settingsBtn" onclick="openSettings()">⚙</div>

<div id="settingsOverlay">
  <div id="settingsWindow">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <h2 style="margin:0;font-weight:400;font-size:22px">Настройки</h2>
      <button onclick="closeSettings()" class="btn" style="background:transparent;color:var(--md-primary);padding:8px">✕</button>
    </div>
    <hr style="border:none;border-top:1px solid var(--md-outline-variant);margin:16px 0">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0">
      <span>Тема интерфейса</span>
      <span id="themeCurrent" onclick="toggleThemeMenu()" style="cursor:pointer;padding:8px 16px;border-radius:10px;background:var(--md-primary-container);color:var(--md-on-primary-container);font-weight:500">Светлая ▼</span>
    </div>
    <div id="themeMenu" style="display:none;text-align:right;margin-top:8px">
      <div id="lightOpt" onclick="setTheme('light')" style="cursor:pointer;padding:8px 16px;border-radius:8px;display:inline-block">Светлая</div>
      <div id="darkOpt" onclick="setTheme('dark')" style="cursor:pointer;padding:8px 16px;border-radius:8px;display:inline-block">Тёмная</div>
    </div>
    <div style="margin-top:24px">
      <div style="margin-bottom:12px;color:var(--md-on-surface-variant);font-size:14px">Цветовая схема</div>
      <div id="colorPicker" style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="color-picker-btn" style="background:#6750A4" onclick="setAccent('#6750A4')">Фиолетовый</button>
        <button class="color-picker-btn" style="background:#1a73e8" onclick="setAccent('#1a73e8')">Синий</button>
        <button class="color-picker-btn" style="background:#b3261e" onclick="setAccent('#b3261e')">Красный</button>
        <button class="color-picker-btn" style="background:#188038" onclick="setAccent('#188038')">Зелёный</button>
        <button class="color-picker-btn" style="background:#d63384" onclick="setAccent('#d63384')">Розовый</button>
        <button class="color-picker-btn" style="background:#f9ab00" onclick="setAccent('#f9ab00')">Жёлтый</button>
        <button class="color-picker-btn" style="background:#80868b" onclick="setAccent('#80868b')">Серый</button>
      </div>
    </div>
    <hr style="border:none;border-top:1px solid var(--md-outline-variant);margin:16px 0">
    <div style="text-align:center">
      <button onclick="requestGoogleAuth()" class="btn" style="background:#4285F4;">Переподключить Google Диск</button>
    </div>
  </div>
</div>

<script>
// Вставляем твои сгенерированные ключи напрямую в конфигурацию приложения
const CLIENT_ID = '330004729750-gpksj9unmlkmlck0km9mf2r8cdn59d0g.apps.googleusercontent.com';
const API_KEY = 'AIzaSyA3RYlQBPFRGkOBbyl61OAsn1W_19AZPz0';
const SCOPES = 'https://www.googleapis.com/auth/drive.appdata';

let data = JSON.parse(localStorage.getItem('safe8') || '[]');
let current = null;
let currentNoteIndex = null;
let tokenClient;
let gapiInited = false;
let gisInited = false;
let googleDriveFileId = null;

function handleLogin(){
 if(document.getElementById('loginInput').value==='95632010'){
   document.getElementById('loginScreen').style.display='none';
   if (gapiInited && gisInited) {
     startCloudSync();
   }
 }else{
   document.getElementById('loginError').textContent='Неверный пароль';
 }
}

document.getElementById('loginInput').addEventListener('keydown', e=>{
 if(e.key==='Enter') handleLogin();
});

function updateSyncStatus(text) {
  const statusEl = document.getElementById('syncStatus');
  if (statusEl) statusEl.textContent = text;
}

// Загрузка библиотек Google API
function gapiLoaded() { gapi.load('client', initializeGapiClient); }
async function initializeGapiClient() {
  await gapi.client.init({ apiKey: API_KEY, discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'] });
  gapiInited = true; checkAuthPreReqs();
}
function gisLoaded() {
  tokenClient = google.accounts.oauth2.initTokenClient({ client_id: CLIENT_ID, scope: SCOPES, callback: '', });
  gisInited = true; checkAuthPreReqs();
}
function checkAuthPreReqs() {
  if (gapiInited && gisInited) updateSyncStatus('Облако готово к авторизации');
}

// Запуск облачной синхронизации
function startCloudSync() {
  const token = localStorage.getItem('gdrive_token');
  if (token) {
    gapi.client.setToken({ access_token: token });
    loadDataFromDrive();
  } else {
    requestGoogleAuth();
  }
}

function requestGoogleAuth() {
  tokenClient.callback = async (resp) => {
    if (resp.error) return updateSyncStatus('Ошибка авторизации в Google');
    localStorage.setItem('gdrive_token', resp.access_token);
    updateSyncStatus('Синхронизация запущена...');
    loadDataFromDrive();
  };
  tokenClient.requestAccessToken({ prompt: 'consent' });
}

// Поиск и загрузка файла из скрытой папки appDataFolder
async function loadDataFromDrive() {
  try {
    const response = await gapi.client.drive.files.list({ spaces: 'appDataFolder', fields: 'files(id, name)', pageSize: 1 });
    const files = response.result.files;
    if (files && files.length > 0) {
      googleDriveFileId = files[0].id;
      const fileContent = await gapi.client.drive.files.get({ fileId: googleDriveFileId, alt: 'media' });
      if (fileContent.body) {
        data = JSON.parse(fileContent.body);
        localStorage.setItem('safe8', JSON.stringify(data));
        renderTree();
        if(current) openFolder(current);
      }
      updateSyncStatus('Синхронизация завершена успешно');
    } else {
      updateSyncStatus('Файл в облаке не найден. Создаём новый...');
      await uploadDataToDrive(true);
    }
  } catch (err) {
    if (err.status === 401) { requestGoogleAuth(); } 
    else { updateSyncStatus('Ошибка работы с облаком'); }
  }
}

// Выгрузка изменений в скрытую папку Google Drive
async function uploadDataToDrive(isNew = false) {
  const boundary = 'foo_bar_baz';
  const delimiter = "\r\n--" + boundary + "\r\n";
  const close_delim = "\r\n--" + boundary + "--";
  const metadata = { name: 'safe_vault_data.json', parents: isNew ? ['appDataFolder'] : undefined };
  const multipartRequestBody = delimiter + 'Content-Type: application/json\r\n\r\n' + JSON.stringify(metadata) + delimiter + 'Content-Type: application/json\r\n\r\n' + JSON.stringify(data) + close_delim;

  try {
    if (isNew || !googleDriveFileId) {
      const resp = await gapi.client.request({ path: '/upload/drive/v3/files', method: 'POST', params: { uploadType: 'multipart' }, headers: { 'Content-Type': 'multipart/related; boundary="' + boundary + '"' }, body: multipartRequestBody });
      googleDriveFileId = resp.result.id;
    } else {
      await gapi.client.request({ path: '/upload/drive/v3/files/' + googleDriveFileId, method: 'PATCH', params: { uploadType: 'multipart' }, headers: { 'Content-Type': 'multipart/related; boundary="' + boundary + '"' }, body: multipartRequestBody });
    }
    updateSyncStatus('Изменения сохранены в облаке');
  } catch (err) {
    updateSyncStatus('Ошибка отправки изменений');
  }
}

function saveData(){
 localStorage.setItem('safe8',JSON.stringify(data));
 renderTree();
 uploadDataToDrive(false);
}

function tick(){
 const clockEl = document.getElementById('clock');
 if(clockEl) {
   const now = new Date();
   clockEl.textContent = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
 }
}
setInterval(tick,1000);tick();

function newRoot(){
 let n=prompt('Название каталога');
 if(!n)return;
 data.push({name:n,children:[],notes:[],files:[]});
 saveData();
}

function getNode(path){
 let n=data[path[0]];
 for(let i=1;i<path.length;i++) n=n.children[path[i]];
 return n;
}

function addSub(path){
 let n=prompt('Название подкаталога');
 if(!n)return;
 getNode(path).children.push({name:n,children:[],notes:[],files:[]});
 saveData();
}

function deleteFolder(path){
 openDeleteModal('Удаление каталога','Будут удалены каталог и всё его содержимое.', function(){
 if(path.length===1){ data.splice(path[0],1); }
 else{
   let parent=getNode(path.slice(0,-1));
   parent.children.splice(path[path.length-1],1);
 }
 saveData();
 document.getElementById('content').innerHTML='Пусто';
 document.getElementById('title').innerText='Выберите каталог';
 current=null;
 });
}

function openFolder(path){
 current=path;
 document.querySelectorAll('.node').forEach(x=>x.classList.remove('selected'));
 const el=document.getElementById('node_'+path.join('_'));
 if(el) el.classList.add('selected');

 let n=getNode(path);
 document.getElementById('title').innerText=n.name;

 let html='';
 (n.notes || []).forEach((x,i)=>{
  html+=`<div class="item" onclick="openNote(${i})">
   <div style="text-align:center;padding:12px;word-break:break-all;font-size:13px">${x.title}</div>
   <button class="item-delete" onclick="event.stopPropagation();deleteNote(${i})">🗑️</button>
  </div>`;
 });

 (n.files || []).forEach((x,i)=>{
  html+=`<div class="item">
   <img src="${x}" onclick="openImage('${x}')" alt="Файл">
   <button class="item-delete" onclick="event.stopPropagation();deleteFile(${i})">🗑️</button>
  </div>`;
 });

 document.getElementById('content').innerHTML=html||'Пусто';
}

function deleteNote(i){
 let name=getNode(current).notes[i].title;
 openDeleteModal('Удаление заметки', 'Удалить "'+name+'"?', function(){
   getNode(current).notes.splice(i,1);
   saveData();
   openFolder(current);
 });
}

function deleteFile(i){
 openDeleteModal('Удаление файла', 'Удалить этот файл?', function(){
   getNode(current).files.splice(i,1);
   saveData();
   openFolder(current);
 });
}

function openImage(src){
 const viewer = document.getElementById('viewer');
 document.getElementById('viewerImg').src=src;
 viewer.style.display='flex';
}

function openNote(i){
 currentNoteIndex=i;
 let note=getNode(current).notes[i];
 document.getElementById('noteTitleView').style.display='inline';
 document.getElementById('noteTitleEdit').style.display='none';
 document.getElementById('noteTitleView').textContent=note.title;
 document.getElementById('noteContent').value=note.text||'';
 document.getElementById('noteModal').style.display='block';
}

function closeNoteModal(){ document.getElementById('noteModal').style.display='none'; }

function enableTitleEdit(){
 const v=document.getElementById('noteTitleView');
 const e=document.getElementById('noteTitleEdit');
 e.value=v.textContent; v.style.display='none'; e.style.display='inline-block'; e.focus();
}

function saveCurrentNote(){
 if(currentNoteIndex===null) return;
 let note=getNode(current).notes[currentNoteIndex];
 const edit=document.getElementById('noteTitleEdit');
 const view=document.getElementById('noteTitleView');
 
 if(edit.style.display!=='none' && edit.value.trim()){
   note.title=edit.value.trim();
   view.textContent=note.title;
   edit.style.display='none';
   view.style.display='inline';
 }
 note.text=document.getElementById('noteContent').value;
 saveData();
 openFolder(current);
}

function createNote(){
 if(!current)return alert('Выберите каталог');
 let name=prompt('Название заметки');
 if(!name)return;
 if(!getNode(current).notes) getNode(current).notes = [];
 getNode(current).notes.push({title:name,text:''});
 saveData(); openFolder(current);
}

function uploadFile(){ 
 if(!current) return alert('Выберите каталог');
 document.getElementById('fileInput').click(); 
}

document.getElementById('fileInput').onchange=e=>{
 let f=e.target.files[0]; if(!f)return;
 let r=new FileReader();
 r.onload=()=>{
   if(!getNode(current).files) getNode(current).files = [];
   getNode(current).files.push(r.result);
   saveData(); openFolder(current);
 };
 r.readAsDataURL(f);
};

function toggleMenu(){
 const menu = document.getElementById('menu');
 menu.style.display=menu.style.display==='block'?'none':'block';
}

function draw(nodes,path=[],prefix=''){
 let h='';
 nodes.forEach((n,i)=>{
   let p=[...path,i];
   h+=`<div class="node" id="node_${p.join('_')}" onclick='openFolder(${JSON.stringify(p)})'>
   <span>${prefix}├─ ${n.name}</span>
   <span>
     <button onclick='event.stopPropagation();addSub(${JSON.stringify(p)})'>➕</button>
     <button class="btn-delete" onclick='event.stopPropagation();deleteFolder(${JSON.stringify(p)})'>🗑️</button>
   </span>
   </div>`;
   if(n.children && n.children.length > 0){ h+=draw(n.children,p,prefix+'│&nbsp;&nbsp;'); }
 });
 return h;
}

function renderTree(){ 
 document.getElementById('tree').innerHTML=draw(data); 
 if(current) {
   const el=document.getElementById('node_'+current.join('_'));
   if(el) el.classList.add('selected');
 }
}

function openSettings(){document.getElementById('settingsOverlay').style.display='block';}
function closeSettings(){document.getElementById('settingsOverlay').style.display='none';}
function toggleThemeMenu(){
 const m=document.getElementById('themeMenu');
 m.style.display=m.style.display==='block'?'none':'block';
}

function setTheme(t){ localStorage.setItem('safe_theme',t); applyTheme(); }

function applyTheme() {
 const t = localStorage.getItem('safe_theme') || 'light';
 document.documentElement.setAttribute('data-theme', t);
 const currentLabel = document.getElementById('themeCurrent');
 const accent = localStorage.getItem('accentColor') || '#6750A4';
 
 if (t === 'light') {
   currentLabel.textContent = 'Светлая ▼';
   document.getElementById('lightOpt').style.background = 'var(--md-primary-container)';
   document.getElementById('lightOpt').style.color = 'var(--md-on-primary-container)';
   document.getElementById('darkOpt').style.background = 'transparent';
   document.getElementById('darkOpt').style.color = 'inherit';
   
   document.documentElement.style.setProperty('--md-primary', accent);
   document.documentElement.style.setProperty('--md-primary-container', accent + '26');
   document.documentElement.style.setProperty('--md-on-primary-container', accent);
 } else {
   currentLabel.textContent = 'Тёмная ▼';
   document.getElementById('darkOpt').style.background = 'var(--md-primary-container)';
   document.getElementById('darkOpt').style.color = 'var(--md-on-primary-container)';
   document.getElementById('lightOpt').style.background = 'transparent';
   document.getElementById('lightOpt').style.color = 'inherit';
   
   document.documentElement.style.setProperty('--md-primary', accent);
   document.documentElement.style.setProperty('--md-primary-container', accent + '4D');
   document.documentElement.style.setProperty('--md-on-primary-container', '#ffffff');
 }
}

function setAccent(color){ localStorage.setItem('accentColor',color); applyTheme(); }

function searchCatalogs(){
 const q=(document.getElementById('catalogSearch')?.value||'').toLowerCase();
 document.querySelectorAll('.node').forEach(n=>{
   n.classList.remove('search-highlight');
   if(q && n.textContent.toLowerCase().includes(q)){
      n.classList.add('search-highlight');
   }
 });
}

function openDeleteModal(title,text,callback){
 document.getElementById('delTitle').textContent=title;
 document.getElementById('delText').textContent=text;
 document.getElementById('customDeleteModal').style.display='block';
 document.getElementById('deleteConfirmBtn').onclick=function(){
   document.getElementById('customDeleteModal').style.display='none';
   if(callback) callback();
 };
}
function closeDeleteModal(){ document.getElementById('customDeleteModal').style.display='none'; }

// Инициализируем библиотеки Google при загрузке страницы окна
window.onload = () => {
  applyTheme(); 
  renderTree();
  gapiLoaded();
  gisLoaded();
};
</script>
</body>
