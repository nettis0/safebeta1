<!DOCTYPE html>
<html>
<body>
    <input type="password" id="pass" placeholder="Пароль">
    <button onclick="test()">ПРОВЕРИТЬ СВЯЗЬ</button>
    <div id="log" style="white-space: pre-wrap; font-family: monospace; margin-top: 10px;"></div>

    <script>
        const ENCRYPTED_TOKEN = "ТВОЯ_BASE64_СТРОКА"; 
        const REPO = 'nettis0/safebeta1'; 
        const FILE = 'db.json';

        function log(msg) { document.getElementById('log').innerText += msg + "\n"; }

        async function test() {
            log("Начинаю тест...");
            try {
                const TOKEN = atob(ENCRYPTED_TOKEN);
                log("Токен расшифрован.");
                
                const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`, { 
                    headers: { 'Authorization': 'token ' + TOKEN } 
                });
                
                log("Ответ сервера: " + res.status);
                const data = await res.json();
                log("Данные получены: " + JSON.stringify(data).substring(0, 100) + "...");
            } catch(e) {
                log("КРИТИЧЕСКАЯ ОШИБКА: " + e.message);
            }
        }
    </script>
</body>
</html>
