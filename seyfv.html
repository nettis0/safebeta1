<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SafeVault</title>
</head>
<body>
    <h3>SafeVault</h3>
    <input type="password" id="pass" placeholder="Пароль от заметок"><br><br>
    <textarea id="content" style="width:100%; height:300px;" placeholder="Тут будут твои данные..."></textarea><br>
    <button onclick="save()">Сохранить</button>
    <button onclick="load()">Загрузить</button>

    <script>
        // СЮДА ВСТАВЬ СВОЮ "КАШУ" (результат btoa)
        const ENCRYPTED_TOKEN = "Z3BoX0VrWDB6alJxbG43Y1dGN1dwaFI4N1ptYmM4cHRXazNpc1hTUA=="; 
        const REPO = 'netti0/safebeta1'; 
        const FILE = 'db.json';

        async function getCryptoKey(pass) {
            const enc = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
            return crypto.subtle.deriveKey({name: "PBKDF2", salt: enc.encode("salt"), iterations: 100000, hash: "SHA-256"}, keyMaterial, {name: "AES-GCM", length: 256}, false, ["encrypt", "decrypt"]);
        }

        async function save() {
            const TOKEN = atob(ENCRYPTED_TOKEN);
            const pass = document.getElementById('pass').value;
            const text = document.getElementById('content').value;
            const key = await getCryptoKey(pass);
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const enc = await crypto.subtle.encrypt({name: "AES-GCM", iv}, key, new TextEncoder().encode(text));
            const content = btoa(String.fromCharCode(...iv, ...new Uint8Array(enc)));
            
            const response = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${TOKEN}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: "update", content: content })
            });
            alert(response.ok ? "Сохранено!" : "Ошибка API — проверь токен");
        }

        async function load() {
            const TOKEN = atob(ENCRYPTED_TOKEN);
            const pass = document.getElementById('pass').value;
            const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`, { headers: {'Authorization': `token ${TOKEN}`} });
            if (!res.ok) return alert("Файл не найден");
            const data = await res.json();
            const raw = Uint8Array.from(atob(data.content), c => c.charCodeAt(0));
            try {
                const decrypted = await crypto.subtle.decrypt({name: "AES-GCM", iv: raw.slice(0, 12)}, await getCryptoKey(pass), raw.slice(12));
                document.getElementById('content').value = new TextDecoder().decode(decrypted);
            } catch(e) { alert("Ошибка расшифровки (неверный пароль?)"); }
        }
    </script>
</body>
</html>
